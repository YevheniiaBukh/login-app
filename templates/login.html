<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <div class="card">
      <h1>Login</h1>
      <form method="POST" action="/login">
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="Enter your username"
        />
        <br /><br />
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="Enter your password"
        />

        <button type="submit">Login</button>
      </form>

      <a href="/register">Register here</a>
    </div>
  </body>
</html>
